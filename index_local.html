<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seguimiento de Proyectos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2733;--mute:#66727f;--line:#dde1e6;--acc:#0e5a6b;--acc-d:#0a4553;
--ok:#1f8a4c;--warn:#c98a00;--bad:#c0392b;--r:6px}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
.hidden{display:none!important}
header{background:var(--acc-d);color:#fff;display:flex;align-items:center;gap:24px;padding:0 24px;height:52px}
header .brand{font-weight:600;font-size:15px}
header nav{display:flex;gap:4px;flex:1}
header nav button{background:none;border:0;color:#cfe3e8;padding:16px 12px;font:inherit;cursor:pointer}
header nav button.on{color:#fff;box-shadow:inset 0 -3px #fff}
header .who{font-size:13px;color:#cfe3e8}
header .out{background:none;border:1px solid #6f9aa5;color:#fff;border-radius:var(--r);padding:5px 10px;font:inherit;cursor:pointer}
main{max-width:1320px;margin:0 auto;padding:24px}
h1{font-size:20px;margin:0 0 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-size:24px;font-weight:600}
.kpi span{color:var(--mute);font-size:12.5px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;background:#fff;color:var(--ink);width:100%}
.bar input,.bar select{width:auto}
.bar input[type=search]{min-width:260px}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrapt{white-space:normal;min-width:160px}
th{background:#eef1f4;font-weight:600;cursor:pointer;user-select:none}
tr:last-child td{border-bottom:0}
.chip{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:500;border:1px solid}
.v{color:var(--ok);border-color:var(--ok)}.a{color:var(--warn);border-color:var(--warn)}.r{color:var(--bad);border-color:var(--bad)}.n{color:var(--mute);border-color:var(--line)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:var(--r);padding:8px 14px;font:inherit;font-weight:500;cursor:pointer}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.del{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,th:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.login{max-width:360px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.login h1{margin-bottom:4px}.login p{color:var(--mute);margin:0 0 18px}
label{display:block;font-weight:500;margin:12px 0 4px;font-size:13px}
.err{color:var(--bad);margin-top:10px;min-height:18px}
.modal{position:fixed;inset:0;background:rgba(20,30,40,.45);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.panel{background:#fff;border-radius:var(--r);width:100%;max-width:820px;padding:22px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}
.grid .full{grid-column:1/-1}
.calc{display:flex;gap:10px;flex-wrap:wrap;background:#eef1f4;border-radius:var(--r);padding:10px 12px;margin-top:14px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;right:20px;bottom:20px;padding:11px 16px;border-radius:var(--r);color:#fff;z-index:9}
.toast.ok{background:var(--ok)}.toast.bad{background:var(--bad)}
.empty{padding:28px;text-align:center;color:var(--mute)}
@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" class="login hidden">
  <h1>Seguimiento de proyectos</h1>
  <p>Versión de demostración local.</p><p style="font-size:12.5px">Usuarios: <b>director.mantenimiento@demo.com</b>, <b>director.proyectos@demo.com</b> o <b>gerencia@demo.com</b><br>Contraseña: <b>demo123</b></p>
  <label for="em">Correo electrónico</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password">
  <div class="err" id="loginErr" role="alert"></div>
  <button class="btn" id="loginBtn" style="width:100%;margin-top:8px">Iniciar sesión</button>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <div class="brand">Seguimiento de proyectos</div>
    <nav id="nav"></nav>
    <span class="who" id="who"></span>
    <button class="out" id="logout">Cerrar sesión</button>
  </header>
  <main id="view"></main>
</div>
<div id="modalRoot"></div>

<script>
// ====== VERSIÓN LOCAL (sin Supabase): los datos se guardan en este navegador ======
// Usuarios de prueba (contraseña de todos: demo123):
//   director.mantenimiento@demo.com | director.proyectos@demo.com | gerencia@demo.com
const sb = (() => {
  const day = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
  const U = [
    { id: "u1", full_name: "Director de Mantenimiento", email: "director.mantenimiento@demo.com", role: "director" },
    { id: "u2", full_name: "Director de Proyectos", email: "director.proyectos@demo.com", role: "director" },
    { id: "u3", full_name: "Gerencia General", email: "gerencia@demo.com", role: "gerencia" }
  ];
  const P = (n, code, name, dir, area, fis, cro, st, pri, risk, hito, hd, com, rep) => ({
    id: "p" + n, project_code: code, project_name: name, description: "", director_id: dir, area,
    start_date: day(-200), planned_end_date: day(90), estimated_end_date: day(90), physical_progress: fis,
    schedule_progress: cro, status: st, priority: pri, risks: risk, next_milestone: hito,
    next_milestone_date: hd ? day(hd) : null, executive_comments: com, last_report_date: day(rep) });
  const SEED = [
    P(1, "MAN-001", "Reemplazo de transformadores", "u1", "Mantenimiento", 70, 80, "En ejecución", "Alta", "Retraso en entrega de equipos", "Recepción de equipos", 20, "Seguimiento semanal con proveedor", -1),
    P(2, "MAN-002", "Plan de mantenimiento preventivo", "u1", "Mantenimiento", 85, 85, "En ejecución", "Media", "", "Cierre de ciclo 3", 15, "Sin novedades", -15),
    P(3, "MAN-003", "Pintura y señalización de planta", "u1", "Mantenimiento", 100, 100, "Finalizado", "Baja", "", "", 0, "Entregado", -60),
    P(4, "PRY-001", "Ampliación bodega logística", "u2", "Proyectos", 40, 70, "Atrasado", "Alta", "Permisos municipales demorados", "Obtención de licencia", 10, "Requiere decisión de Gerencia", -2),
    P(5, "PRY-002", "Sistema de monitoreo", "u2", "Proyectos", 55, 60, "En riesgo", "Media", "Dependencia de proveedor único", "Pruebas piloto", 25, "Avance aceptable", -8),
    P(6, "PRY-003", "Rediseño de layout de producción", "u2", "Proyectos", 5, 10, "En ejecución", "Baja", "", "Levantamiento de información", 5, "Inicio según lo previsto", 0)
  ];
  const KEY = "seguimiento_demo_v1";
  let mem = null;
  const load = () => { try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {} return mem || { projects: SEED, session: null }; };
  const store = d => { mem = d; try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} };
  const wait = v => new Promise(r => setTimeout(() => r(v), 80));
  const meOf = d => U.find(u => u.id === d.session);
  const denied = { error: { code: "42501", message: "row-level security" } };

  const query = (table) => {
    let op = "select", payload = null, filt = null, one = false;
    const run = () => {
      const d = load(), me = meOf(d);
      if (!me) return { data: null, error: { message: "Sin sesión" } };
      if (table === "profiles") {
        const rows = U.filter(u => u.id === me.id || me.role === "gerencia").filter(u => !filt || u[filt[0]] === filt[1]);
        return one ? { data: rows[0] || null, error: rows[0] ? null : { message: "No encontrado" } } : { data: rows, error: null };
      }
      const visible = d.projects.filter(p => p.director_id === me.id || me.role === "gerencia");
      if (op === "select") return { data: visible.map(p => ({ ...p, profiles: { full_name: U.find(u => u.id === p.director_id)?.full_name } })), error: null };
      if (me.role !== "director") return denied;   // Gerencia: solo lectura
      if (op === "insert") {
        if (d.projects.some(p => p.project_code === payload.project_code)) return { error: { code: "23505", message: "dup" } };
        d.projects.push({ ...payload, id: "p" + Date.now(), director_id: me.id, last_report_date: day(0) });
      } else {
        const t = d.projects.find(p => p.id === filt[1]);
        if (!t || t.director_id !== me.id) return { error: null };   // RLS: 0 filas afectadas
        if (op === "update") {
          if (d.projects.some(p => p.id !== t.id && p.project_code === payload.project_code)) return { error: { code: "23505", message: "dup" } };
          Object.assign(t, payload, { director_id: me.id, last_report_date: day(0) });
        } else d.projects = d.projects.filter(p => p.id !== t.id);
      }
      store(d); return { error: null };
    };
    const q = {
      select: () => q, insert: v => { op = "insert"; payload = v; return q; },
      update: v => { op = "update"; payload = v; return q; }, delete: () => { op = "delete"; return q; },
      eq: (k, v) => { filt = [k, v]; return q; }, single: () => { one = true; return q; },
      then: (res, rej) => wait(run()).then(res, rej)
    };
    return q;
  };
  return {
    from: query,
    auth: {
      getSession: () => wait({ data: { session: meOf(load()) ? { user: { id: load().session } } : null } }),
      signInWithPassword: ({ email, password }) => {
        const u = U.find(x => x.email === email.toLowerCase());
        if (!u || password !== "demo123") return wait({ error: { message: "Credenciales inválidas" } });
        const d = load(); d.session = u.id; store(d); return wait({ error: null });
      },
      signOut: () => { const d = load(); d.session = null; store(d); return wait({}); }
    }
  };
})();
// ================================================================================

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATES = ["No iniciado","En ejecución","En riesgo","Atrasado","Suspendido","Finalizado"];
let me = null, projects = [], sortKey = "project_code", sortDir = 1, view = null;

/* ---------- Cálculos automáticos ---------- */
const calc = p => {
  const f = Number(p.physical_progress), s = Number(p.schedule_progress);
  const dev = f - s;
  const comp = s === 0 ? null : Math.min(100, f / s * 100);
  let sem;
  if (p.status === "Finalizado") sem = { t: "FINALIZADO", c: "n", color: "#66727f" };
  else if (dev >= -5) sem = { t: "VERDE", c: "v", color: "var(--ok)" };
  else if (dev >= -15) sem = { t: "AMARILLO", c: "a", color: "var(--warn)" };
  else sem = { t: "ROJO", c: "r", color: "var(--bad)" };
  const days = Math.floor((new Date(new Date().toDateString()) - new Date(p.last_report_date + "T00:00:00")) / 864e5);
  const stale = days > 7;
  return { dev, comp, sem, stale, days };
};
const fmtDev = d => (d > 0 ? "+" : "") + d.toFixed(1).replace(".", ",") + "%";
const fmtComp = c => c === null ? "N/A" : c.toFixed(1).replace(".", ",") + "%";
const semHtml = s => `<span class="chip ${s.c}"><i class="dot" style="background:${s.color}"></i>${s.t}</span>`;
const repHtml = k => `<span class="chip ${k.stale ? "r" : "v"}">${k.stale ? "REPORTE DESACTUALIZADO" : "ACTUALIZADO"}</span>`;

/* ---------- Utilidades ---------- */
function toast(msg, ok = true) {
  const t = document.createElement("div"); t.className = "toast " + (ok ? "ok" : "bad"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}
const errMsg = e => {
  const m = e?.message || "Error desconocido";
  if (e?.code === "23505") return "Ya existe un proyecto con ese código.";
  if (e?.code === "42501" || /row-level security/i.test(m)) return "No tienes permiso para realizar esta acción.";
  if (e?.code === "23514") return "Algún valor no cumple las reglas (porcentajes 0–100 o fechas).";
  return m;
};

/* ---------- Sesión ---------- */
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  const { data, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if (error || !data) { await sb.auth.signOut(); showLogin("Tu usuario no tiene perfil configurado. Contacta al administrador."); return; }
  me = data; showApp();
}
function showLogin(msg = "") {
  $("app").classList.add("hidden"); $("login").classList.remove("hidden"); $("loginErr").textContent = msg;
}
$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
  if (error) { $("loginErr").textContent = "Correo o contraseña incorrectos."; return; }
  $("pw").value = ""; boot();
};
$("pw").addEventListener("keydown", e => e.key === "Enter" && $("loginBtn").click());
$("logout").onclick = async () => { await sb.auth.signOut(); me = null; showLogin(); };

function showApp() {
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  $("who").textContent = me.full_name || me.email;
  const items = me.role === "director"
    ? [["mine", "Mis proyectos"]]
    : [["summary", "Resumen gerencial"], ["all", "Proyectos"]];
  $("nav").innerHTML = items.map(([k, l]) => `<button data-k="${k}">${l}</button>`).join("");
  $("nav").querySelectorAll("button").forEach(b => b.onclick = () => go(b.dataset.k));
  go(items[0][0]);
}
async function go(k) {
  view = k;
  $("nav").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.k === k));
  $("view").innerHTML = '<div class="empty">Cargando…</div>';
  // RLS filtra en servidor: el Director solo recibe sus proyectos.
  const { data, error } = await sb.from("projects").select("*, profiles(full_name)");
  if (error) { $("view").innerHTML = `<div class="empty">No se pudo cargar la información: ${esc(errMsg(error))}</div>`; return; }
  projects = data; render();
}

/* ---------- Render ---------- */
function render() {
  const isDir = me.role === "director";
  let html = `<h1>${view === "mine" ? "Mis proyectos" : view === "summary" ? "Resumen gerencial" : "Proyectos"}</h1>`;
  if (view === "summary") html += kpiHtml();
  html += `<div class="bar">
    <input type="search" id="q" placeholder="Buscar por código, nombre o director" aria-label="Buscar">
    <select id="fs" aria-label="Estado"><option value="">Todos los estados</option>${STATES.map(s => `<option>${s}</option>`).join("")}</select>
    <select id="fm" aria-label="Semáforo"><option value="">Todos los semáforos</option><option>VERDE</option><option>AMARILLO</option><option>ROJO</option><option>FINALIZADO</option></select>
    <select id="fr" aria-label="Reporte"><option value="">Todos los reportes</option><option value="ok">Actualizados</option><option value="old">Desactualizados</option></select>
    ${isDir ? '<span style="flex:1"></span><button class="btn" id="newP">Nuevo proyecto</button>' : ""}
  </div><div class="wrap" id="tbl"></div>`;
  $("view").innerHTML = html;
  ["q", "fs", "fm", "fr"].forEach(i => $(i).oninput = table);
  if (isDir) $("newP").onclick = () => form();
  table();
}
function kpiHtml() {
  const c = projects.map(p => ({ p, k: calc(p) }));
  const comps = c.map(x => x.k.comp).filter(x => x !== null);
  const avg = comps.length ? comps.reduce((a, b) => a + b, 0) / comps.length : null;
  const n = s => projects.filter(p => p.status === s).length;
  const last = projects.map(p => p.last_report_date).sort().pop();
  const K = [["Total de proyectos", projects.length], ["En ejecución", n("En ejecución")], ["Finalizados", n("Finalizado")],
    ["En riesgo", n("En riesgo")], ["Atrasados", n("Atrasado")], ["Cumplimiento promedio", fmtComp(avg)],
    ["Reportes actualizados", c.filter(x => !x.k.stale).length], ["Reportes desactualizados", c.filter(x => x.k.stale).length],
    ["Último reporte", last || "—"]];
  return `<div class="kpis">${K.map(([l, v]) => `<div class="kpi"><b>${esc(v)}</b><span>${l}</span></div>`).join("")}</div>`;
}
function table() {
  const q = $("q").value.toLowerCase(), fs = $("fs").value, fm = $("fm").value, fr = $("fr").value;
  const isDir = me.role === "director";
  let rows = projects.map(p => ({ p, k: calc(p), dir: p.profiles?.full_name || "" })).filter(({ p, k, dir }) =>
    (!q || (p.project_code + " " + p.project_name + " " + dir).toLowerCase().includes(q)) &&
    (!fs || p.status === fs) && (!fm || k.sem.t === fm) && (!fr || (fr === "old") === k.stale));
  const val = r => ({ dir: r.dir, dev: r.k.dev, comp: r.k.comp ?? -1, sem: r.k.sem.t, stale: r.k.days }[sortKey] ?? r.p[sortKey] ?? "");
  rows.sort((a, b) => { const x = val(a), y = val(b); return (x > y ? 1 : x < y ? -1 : 0) * sortDir; });
  const cols = [["project_code", "Código"], ["project_name", "Proyecto"], ["dir", "Director"], ["status", "Estado"],
    ["physical_progress", "Avance"], ["schedule_progress", "Cronograma"], ["comp", "Cumplimiento"], ["dev", "Desviación"],
    ["sem", "Semáforo"], ["next_milestone", "Próximo hito"], ["last_report_date", "Último reporte"], ["stale", "Reporte"]];
  if (!rows.length) { $("tbl").innerHTML = '<div class="empty">No hay proyectos que coincidan.' + (isDir ? " Usa «Nuevo proyecto» para registrar el primero." : "") + "</div>"; return; }
  $("tbl").innerHTML = `<table><thead><tr>${cols.map(([k, l]) =>
    `<th tabindex="0" data-k="${k}">${l}${sortKey === k ? (sortDir > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}${isDir ? "<th></th>" : ""}</tr></thead><tbody>${rows.map(({ p, k, dir }) => `
    <tr><td>${esc(p.project_code)}</td><td class="wrapt">${esc(p.project_name)}</td><td>${esc(dir)}</td><td>${esc(p.status)}</td>
    <td>${p.physical_progress}%</td><td>${p.schedule_progress}%</td><td>${fmtComp(k.comp)}</td><td>${fmtDev(k.dev)}</td>
    <td>${semHtml(k.sem)}</td><td class="wrapt">${esc(p.next_milestone || "—")}${p.next_milestone_date ? " (" + p.next_milestone_date + ")" : ""}</td>
    <td>${p.last_report_date}</td><td>${repHtml(k)}</td>
    ${isDir ? `<td><button class="btn sm sec" data-e="${p.id}">Actualizar</button> <button class="btn sm del" data-d="${p.id}">Eliminar</button></td>` : ""}</tr>`).join("")}</tbody></table>`;
  $("tbl").querySelectorAll("th[data-k]").forEach(th => {
    const s = () => { sortDir = sortKey === th.dataset.k ? -sortDir : 1; sortKey = th.dataset.k; table(); };
    th.onclick = s; th.onkeydown = e => e.key === "Enter" && s();
  });
  $("tbl").querySelectorAll("[data-e]").forEach(b => b.onclick = () => form(projects.find(p => p.id === b.dataset.e)));
  $("tbl").querySelectorAll("[data-d]").forEach(b => b.onclick = () => del(projects.find(p => p.id === b.dataset.d)));
}

/* ---------- Formulario (solo Director) ---------- */
function form(p = null) {
  const v = k => esc(p?.[k] ?? "");
  const f = (id, label, type = "text", extra = "") => `<div><label for="f_${id}">${label}</label><input id="f_${id}" type="${type}" value="${v(id)}" ${extra}></div>`;
  $("modalRoot").innerHTML = `<div class="modal"><div class="panel" role="dialog" aria-modal="true">
    <h1>${p ? "Actualizar proyecto" : "Nuevo proyecto"}</h1>
    <div class="grid">
      ${f("project_code", "Código del proyecto *")}${f("project_name", "Nombre *")}
      <div class="full"><label for="f_description">Descripción</label><textarea id="f_description" rows="2">${v("description")}</textarea></div>
      ${f("area", "Área *")}
      <div><label for="f_priority">Prioridad</label><select id="f_priority">${["Alta", "Media", "Baja"].map(x => `<option ${p?.priority === x || (!p && x === "Media") ? "selected" : ""}>${x}</option>`).join("")}</select></div>
      ${f("start_date", "Fecha de inicio", "date")}${f("planned_end_date", "Fecha de finalización planificada", "date")}
      ${f("estimated_end_date", "Fecha de finalización estimada", "date")}
      <div><label for="f_status">Estado</label><select id="f_status">${STATES.map(x => `<option ${p?.status === x ? "selected" : ""}>${x}</option>`).join("")}</select></div>
      ${f("physical_progress", "% avance físico (0–100)", "number", 'min="0" max="100" step="0.1"')}
      ${f("schedule_progress", "% avance del cronograma (0–100)", "number", 'min="0" max="100" step="0.1"')}
      <div class="full"><label for="f_risks">Riesgos y problemas</label><textarea id="f_risks" rows="2">${v("risks")}</textarea></div>
      ${f("next_milestone", "Próximo hito")}${f("next_milestone_date", "Fecha del próximo hito", "date")}
      <div class="full"><label for="f_executive_comments">Comentarios ejecutivos</label><textarea id="f_executive_comments" rows="2">${v("executive_comments")}</textarea></div>
    </div>
    <div class="calc" id="liveCalc" aria-live="polite"></div>
    <div class="err" id="fErr" role="alert"></div>
    <div class="actions"><button class="btn sec" id="cancel">Cancelar</button><button class="btn" id="save">Guardar cambios</button></div>
  </div></div>`;
  const live = () => {
    const k = calc({ physical_progress: +$("f_physical_progress").value || 0, schedule_progress: +$("f_schedule_progress").value || 0,
      status: $("f_status").value, last_report_date: new Date().toISOString().slice(0, 10) });
    $("liveCalc").innerHTML = `<span>Desviación: <b>${fmtDev(k.dev)}</b></span><span>Cumplimiento: <b>${fmtComp(k.comp)}</b></span>${semHtml(k.sem)}<span>El último reporte se registra con la fecha de hoy al guardar.</span>`;
  };
  ["f_physical_progress", "f_schedule_progress", "f_status"].forEach(i => $(i).oninput = live); live();
  $("cancel").onclick = () => $("modalRoot").innerHTML = "";
  $("save").onclick = () => save(p);
}
async function save(p) {
  const g = id => $("f_" + id).value.trim();
  const d = id => g(id) || null;
  const row = {
    project_code: g("project_code"), project_name: g("project_name"), description: d("description"), area: g("area"),
    priority: g("priority"), status: g("status"), start_date: d("start_date"), planned_end_date: d("planned_end_date"),
    estimated_end_date: d("estimated_end_date"), physical_progress: g("physical_progress") === "" ? 0 : +g("physical_progress"),
    schedule_progress: g("schedule_progress") === "" ? 0 : +g("schedule_progress"), risks: d("risks"),
    next_milestone: d("next_milestone"), next_milestone_date: d("next_milestone_date"), executive_comments: d("executive_comments")
  };
  const bad = m => $("fErr").textContent = m;
  if (!row.project_code) return bad("El código es obligatorio.");
  if (!row.project_name) return bad("El nombre es obligatorio.");
  if (!row.area) return bad("El área es obligatoria.");
  for (const k of ["physical_progress", "schedule_progress"])
    if (!(row[k] >= 0 && row[k] <= 100)) return bad("Los avances deben estar entre 0 y 100.");
  if (row.start_date && row.planned_end_date && row.planned_end_date < row.start_date)
    return bad("La fecha final planificada no puede ser anterior a la fecha de inicio.");
  // director_id no se envía: lo asigna y protege la base de datos (auth.uid() + RLS).
  const { error } = p ? await sb.from("projects").update(row).eq("id", p.id) : await sb.from("projects").insert(row);
  if (error) return bad(errMsg(error));
  $("modalRoot").innerHTML = ""; toast(p ? "Proyecto actualizado." : "Proyecto creado."); go(view);
}
function del(p) {
  $("modalRoot").innerHTML = `<div class="modal"><div class="panel" style="max-width:440px" role="alertdialog" aria-modal="true">
    <h1>Eliminar proyecto</h1><p>Vas a eliminar <b>${esc(p.project_code)} — ${esc(p.project_name)}</b>. Esta acción no se puede deshacer.</p>
    <div class="actions"><button class="btn sec" id="cancel">Cancelar</button><button class="btn del" id="ok">Eliminar proyecto</button></div></div></div>`;
  $("cancel").onclick = () => $("modalRoot").innerHTML = "";
  $("ok").onclick = async () => {
    const { error } = await sb.from("projects").delete().eq("id", p.id);
    $("modalRoot").innerHTML = "";
    if (error) return toast(errMsg(error), false);
    toast("Proyecto eliminado."); go(view);
  };
}

boot();
</script>
</body>
</html>
